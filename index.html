<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cube Masters Banner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
   

    /* Typing animation */
    @keyframes typing {
      from { width: 0 }
      to { width: 100% }
    }
    @keyframes blink {
      50% { border-color: transparent }
    }
    .typing {
      overflow: hidden;
      white-space: nowrap;
      border-right: .15em solid black;
      animation: typing 3s steps(30, end) forwards, blink .75s step-end infinite;
    }
    .typing.end {
      border-right: none;
    }

    /* Animations */
    @keyframes slideUp {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes zoomIn {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    .animate-slideUp { animation: slideUp 1s ease-out forwards; }
    .animate-zoomIn { animation: zoomIn 1s ease-out forwards; }

    /* Hidden by default for scroll animations */
    .hidden-before {
      opacity: 0;
      transform: translateY(40px);
    }
  </style>
</head>
<body class="min-h-screen overflow-hidden font-sans">
  <!-- Animated Background -->
  <div id="particles" class="absolute inset-0 overflow-hidden"></div>

  <!-- Navigation Bar -->
  <nav class="fixed top-0 left-0 w-full bg-white/80 backdrop-blur-md shadow-sm z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <img src="logo.png" alt="Logo" class="h-10 w-auto">
        <span class="font-bold text-xl text-gray-800">Cube Masters</span>
      </div>
      <ul class="hidden md:flex space-x-8 font-medium text-gray-700">
        <li><a href="#" class="hover:text-black transition">Home</a></li>
        <li><a href="#" class="hover:text-black transition">About</a></li>
        <li><a href="#" class="hover:text-black transition">Leadership</a></li>
        <li><a href="#" class="hover:text-black transition">Join</a></li>
      </ul>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="relative z-10 min-h-screen flex items-center justify-center px-6 py-20">
    <div class="max-w-4xl mx-auto text-center">
      <div class="mb-8 animate-zoomIn">
        <img src="logo.png" alt="Cube Masters Logo" class="mx-auto w-40 md:w-52">
      </div>

      <!-- Hero Heading -->
      <h1 id="heroTitle" class="text-5xl md:text-7xl lg:text-8xl font-bold mb-8 leading-tight typing">
        Cube Masters
      </h1>
      
      <!-- Subtitle -->
      <p class="text-xl md:text-2xl text-gray-800 mb-12 max-w-2xl mx-auto leading-relaxed font-light hidden-before" data-animate="slideUp">
Will add more later but this is the cube masters offical website
      </p>
      
      <!-- Additional Info (3 containers) -->
      <div class="mt-16 grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
        <div class="p-6 rounded-2xl bg-white border hover:bg-gray-100 transition-all duration-300 hidden-before" data-animate="zoomIn">
          <h3 class="text-2xl font-bold text-black mb-2">Feature One</h3>
          <p class="text-gray-700">Add later.</p>
        </div>
        
        <div class="p-6 rounded-2xl bg-white border hover:bg-gray-100 transition-all duration-300 hidden-before" data-animate="zoomIn">
          <h3 class="text-2xl font-bold text-black mb-2">Feature Two</h3>
          <p class="text-gray-700">add later</p>
        </div>
        
        <div class="p-6 rounded-2xl bg-white border hover:bg-gray-100 transition-all duration-300 hidden-before" data-animate="zoomIn">
          <h3 class="text-2xl font-bold text-black mb-2">Feature Three</h3>
          <p class="text-gray-700">add later.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Particles Script -->
  <script>
    const container = document.getElementById("particles");
    const particleCount = 100;
    const particles = [];
    const cubeColors = ["bg-red-400", "bg-green-400", "bg-blue-400", "bg-yellow-400", "bg-orange-400", "bg-white"];

    for (let i = 0; i < particleCount; i++) {
      const particle = document.createElement("div");
      const colorClass = cubeColors[Math.floor(Math.random() * cubeColors.length)];
      particle.className = "absolute rounded-full " + colorClass;
      const size = Math.random() * 8 + 2;
      const opacity = Math.random() * 0.6 + 0.2;
      particle.style.width = size + "px";
      particle.style.height = size + "px";
      particle.style.opacity = opacity;
      container.appendChild(particle);
      particles.push({
        el: particle,
        x: Math.random() * 100,
        y: Math.random() * 100,
        moveSpeed: Math.random() * 2 + 1,
        direction: Math.random() * 360
      });
    }

    function animateParticles() {
      particles.forEach(p => {
        let newX = p.x + Math.cos(p.direction * Math.PI / 180) * p.moveSpeed * 0.1;
        let newY = p.y + Math.sin(p.direction * Math.PI / 180) * p.moveSpeed * 0.1;
        if (newX <= 0 || newX >= 100) {
          p.direction = 180 - p.direction;
          newX = Math.max(0, Math.min(100, newX));
        }
        if (newY <= 0 || newY >= 100) {
          p.direction = -p.direction;
          newY = Math.max(0, Math.min(100, newY));
        }
        p.x = newX;
        p.y = newY;
        p.el.style.left = p.x + "%";
        p.el.style.top = p.y + "%";
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // Remove typing caret after animation
    const heroTitle = document.getElementById("heroTitle");
    heroTitle.addEventListener("animationend", () => {
      heroTitle.classList.add("end");
    });

    // Scroll animations (play once)
    const animatedElements = document.querySelectorAll("[data-animate]");
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const el = entry.target;
          const animation = el.dataset.animate;
          el.classList.remove("hidden-before");
          el.classList.add("animate-" + animation);
          observer.unobserve(el); // ✅ ensures animation plays only once
        }
      });
    }, { threshold: 0.2 });

    animatedElements.forEach(el => observer.observe(el));
  </script>
</body>
</html>
